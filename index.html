<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery 0 and Student Initiatives</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main-container">
      <div style="cursor: pointer" class="logo"></div>
      <div class="mains">
        <iframe name="iframe_a" title="web player" id="frame"></iframe>

        <a href="./htmls/manifesto.html" target="iframe_a">
          <section>
            <img src="./assets/manifesto_kabk.png" alt="Gallery" />
          </section>
        </a>
        <a href="./nextevent.html" target="iframe_a">
          <section>
            <img src="./assets/cohub1.png" alt="NEXT EVENT" />
          </section>
        </a>
        <a href="./archive.html" target="iframe_a">
          <section>
            <img src="./assets/cohub1.png" alt="archive" />
          </section>
        </a>
        <a href="./htmls/union.html" target="iframe_a">
          <section>
            <img
              src="assets/logos:graphics/studentunion logo.png"
              alt="union"
            />
          </section>
        </a>
        <a href="./htmls/green.html" target="iframe_a">
          <section>
            <img
              src="./assets/logos:graphics/greenoffice logo.png"
              alt="Green Office"
            />
          </section>
        </a>
        <a href="./htmls/mushroom.html" target="iframe_a">
          <section>
            <img src="./assets/logos:graphics/cond.png" alt="mushroom radio" />
          </section>
        </a>
        <a href="./htmls/garden.html" target="iframe_a">
          <section>
            <img
              src="./assets/logos:graphics/makers garden logo.png"
              alt="makers garden"
            />
          </section>
        </a>
        <a href="./htmls/news.html" target="iframe_a">
          <section>
            <img src="./assets/logos:graphics/tone.png" alt="newspaper" />
          </section>
        </a>
        <a href="./htmls/film.html" target="iframe_a">
          <section>
            <img
              src="./assets/logos:graphics/filmclub logo.png"
              alt="film club"
            />
          </section>
        </a>
        <a href="./htmls/chess.html" target="iframe_a">
          <section>
            <img
              src="./assets/logos:graphics/chess club.png"
              alt="chess club"
            />
          </section>
        </a>
        <a href="./htmls/cohub.html" target="iframe_a">
          <section>
            <img src="./assets/logos:graphics/cohub logo.png" alt="cohub" />
          </section>
        </a>
        <a href="./htmls/contact.html" target="iframe_a">
          <section>
            <img src="./assets/manifesto_kabk.png" alt="Gallery" />
          </section>
        </a>
      </div>
    </div>
    <script>
      const iframe = document.getElementById("frame");
      const sections = document.querySelectorAll("section");
      const logo = document.querySelector(".logo");
      const mainContainer = document.querySelector(".main-container");
      const mains = document.querySelector(".mains");
      const isDesktop = window.matchMedia("(min-width: 901px)");

      const setIframeHeight = () => {
        iframe.style.height = `${mains.scrollHeight}px`;
      };

      const setIframePosition = (position) => {
        const axis = isDesktop.matches
          ? "X"
          : "Y"; /*condition ? ifTrue : ifFalse (shorter alternative for if/else*/
        iframe.style.transform = `translate${axis}(${position})`;
      };

      logo.addEventListener("click", () => {
        mainContainer.classList.remove("is-open");
        iframe.classList.remove("is-visible");
        setIframePosition(isDesktop.matches ? "100%" : "100vh");
        setIframeHeight();
      });
      sections.forEach((section) => {
        section.addEventListener("click", () => {
          mainContainer.classList.add("is-open");
          iframe.classList.add("is-visible");
          setIframePosition("0");
          setIframeHeight();
        });
      });
      window.addEventListener("resize", setIframeHeight);
      new MutationObserver(setIframeHeight).observe(mains, {
        childList: true,
        subtree: true,
      });
      setIframeHeight();
    </script>
  </body>
</html>
